# One-switch control page for Homarr. Needs HA_TOKEN (a Home Assistant long-lived access token) in a .env file next to this file.
services:
  ha-switch:
    image: nginx:1.27-alpine
    container_name: ha-switch
    restart: unless-stopped
    ports:
      - "127.0.0.1:7590:80"   # localhost only; Tailscale Serve is the way in
    environment:
      - HA_TOKEN=${HA_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./default.conf.template:/etc/nginx/templates/default.conf.template:ro
