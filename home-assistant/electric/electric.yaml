# Electric budget alerts and bill-cycle summaries (Home Assistant package).
# Goes in <config>/packages/electric.yaml. Email layouts live in <config>/custom_templates/electric.jinja.
input_number:
  electric_alert_pct:
    name: Electric alert percent over budget
    min: 5
    max: 100
    step: 1
    initial: 15
    unit_of_measurement: "%"
  electric_alert_dollars:
    name: Electric alert dollars over budget
    min: 5
    max: 300
    step: 1
    initial: 20
    unit_of_measurement: "USD"
  electric_rate:
    name: Electric cost per extra kWh
    min: 0.05
    max: 0.5
    step: 0.001
    initial: 0.163
    unit_of_measurement: "USD/kWh"
  electric_fixed_charge:
    name: Electric fixed monthly charges (estimate)
    min: 0
    max: 100
    step: 0.1
    initial: 17.1
    unit_of_measurement: "USD"
  electric_week_start_usage:
    name: Electric usage at last weekly report
    min: 0
    max: 10000
    step: 0.1
  electric_temp_sum_cycle:
    name: Electric temperature sum (cycle)
    min: -1000000
    max: 1000000
    step: 0.1
  electric_temp_n_cycle:
    name: Electric temperature samples (cycle)
    min: 0
    max: 100000
    step: 1
  electric_temp_sum_week:
    name: Electric temperature sum (week)
    min: -1000000
    max: 1000000
    step: 0.1
  electric_temp_n_week:
    name: Electric temperature samples (week)
    min: 0
    max: 100000
    step: 1
  electric_closed_temp:
    name: Electric closed cycle average temperature
    min: -1000
    max: 1000
    step: 0.1
    initial: -999
  electric_closed_total:
    name: Electric closed cycle usage
    min: 0
    max: 10000
    step: 0.1
  electric_closed_cost:
    name: Electric closed cycle cost
    min: 0
    max: 5000
    step: 0.01
  electric_closed_budget:
    name: Electric closed cycle budget
    min: 0
    max: 10000
    step: 1
  electric_closed_days:
    name: Electric closed cycle length
    min: 0
    max: 70
    step: 1
  electric_last_usage:
    name: Electric last cycle usage seen
    min: 0
    max: 10000
    step: 0.1
  electric_last_cost:
    name: Electric last cycle cost seen
    min: 0
    max: 5000
    step: 0.01

input_text:
  electric_alert_month:
    name: Electric alert last sent month
    max: 10
  electric_weather_entity:
    name: Electric weather entity for outdoor temperature
    max: 100
    initial: "weather.forecast_home"
  electric_temp_history:
    name: Electric cycle average temperature (label:degF, newest last)
    max: 255
    initial: "Aug:76.2,Sep:71.2"
  electric_week_temp_history:
    name: Electric weekly average temperature (label:degF, newest last)
    max: 255
  electric_closed_label:
    name: Electric closed cycle label
    max: 10
  electric_week_history:
    name: Electric weekly history (label:kWh, newest last)
    max: 255
  electric_history:
    name: Electric cycle history (label:kWh, newest last)
    max: 255
    initial: "Jul:321,Aug:423,Sep:455"

input_boolean:
  electric_cycle_closed_pending:
    name: Electric closed cycle not yet reported

input_datetime:
  electric_cycle_start:
    name: Electric cycle start
    has_date: true
    has_time: false

template:
  - sensor:
      - name: "Electric Monthly Budget"
        unique_id: electric_monthly_budget
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        state: >
          {% set b = [750,650,600,450,400,400,400,450,450,320,520,700] %}
          {{ b[(now().month if now().day < 29 else now().month % 12 + 1) - 1] }}
      - name: "Electric Rate Per kWh"
        unique_id: electric_rate_per_kwh
        unit_of_measurement: "USD/kWh"
        state: "{{ states('input_number.electric_rate') | float(0.163) }}"
      - name: "Electric Dashboard"
        unique_id: electric_dashboard
        state: "ok"
        attributes:
          used: "{{ states('sensor.elec_account_07249118370720160943_current_bill_electric_usage_to_date') | float(0) }}"
          forecast: "{{ states('sensor.elec_account_07249118370720160943_current_bill_electric_forecasted_usage') | float(0) }}"
          budget: "{{ states('sensor.electric_monthly_budget') | float(0) }}"
          rate: "{{ states('input_number.electric_rate') | float(0.163) }}"
          fixed: "{{ states('input_number.electric_fixed_charge') | float(17.1) }}"
          comed_cost: "{{ states('sensor.elec_account_07249118370720160943_current_bill_electric_cost_to_date') | float(0) }}"
          comed_fc: "{{ states('sensor.elec_account_07249118370720160943_current_bill_electric_forecasted_cost') | float(0) }}"
          month_label: "{{ (now() if now().day < 29 else now() + timedelta(days=5)).strftime('%b') }}"
          hist: "{{ states('input_text.electric_history') }}"
          temps: "{{ states('input_text.electric_temp_history') }}"
          whist: "{{ states('input_text.electric_week_history') }}"
          wtemps: "{{ states('input_text.electric_week_temp_history') }}"
          week_kwh: >
            {% set u = states('sensor.elec_account_07249118370720160943_current_bill_electric_usage_to_date') | float(0) %}{% set ws = states('input_number.electric_week_start_usage') | float(0) %}{% set ct = states('input_number.electric_closed_total') | float(0) %}{% if ws <= 0 %}-1{% elif u >= ws %}{{ u - ws }}{% else %}{{ (ct - ws) + u }}{% endif %}
          week_temp: "{{ (states('input_number.electric_temp_sum_week') | float(0) / states('input_number.electric_temp_n_week') | float(1)) | round(1) if states('input_number.electric_temp_n_week') | float(0) >= 3 else -999 }}"
          cycle_temp: "{{ (states('input_number.electric_temp_sum_cycle') | float(0) / states('input_number.electric_temp_n_cycle') | float(1)) | round(1) if states('input_number.electric_temp_n_cycle') | float(0) >= 3 else -999 }}"
          outdoor: "{{ state_attr(states('input_text.electric_weather_entity'), 'temperature') | float(-999) }}"
          living: "{{ states('sensor.living_room_temperature_calibrated') | float(-999) }}"
          office: "{{ states('sensor.office_temperature_calibrated') | float(-999) }}"
          bedroom: "{{ states('sensor.bedroom_temperature_calibrated') | float(-999) }}"
          living_h: "{{ states('sensor.h5075_3cff_humidity') | float(-999) }}"
          office_h: "{{ states('sensor.h5075_6e4d_humidity') | float(-999) }}"
          bedroom_h: "{{ states('sensor.h5075_f7ae_humidity') | float(-999) }}"

automation:
  - id: electric_budget_alert
    alias: Electric budget alert
    mode: single
    trigger:
      - platform: state
        entity_id:
          - sensor.elec_account_07249118370720160943_current_bill_electric_forecasted_usage
          - sensor.elec_account_07249118370720160943_current_bill_electric_usage_to_date
    variables:
      used: "{{ states('sensor.elec_account_07249118370720160943_current_bill_electric_usage_to_date') | float(0) }}"
      proj: "{{ [states('sensor.elec_account_07249118370720160943_current_bill_electric_forecasted_usage') | float(0), used] | max }}"
      budget: "{{ states('sensor.electric_monthly_budget') | float(0) }}"
      rate: "{{ states('sensor.electric_rate_per_kwh') | float(0.163) }}"
      mult: "{{ 2 if now().day >= 26 else 1 }}"
      over: "{{ proj - budget }}"
      pct: "{{ states('input_number.electric_alert_pct') | float(15) }}"
      dollars: "{{ states('input_number.electric_alert_dollars') | float(20) }}"
    condition:
      - condition: template
        value_template: "{{ budget > 0 and used > 0 }}"
      - condition: template
        value_template: "{{ states('input_text.electric_alert_month') != now().strftime('%Y-%m') }}"
      - condition: template
        value_template: >
          {{ used > budget or (over >= pct / 100 * budget * mult and over * rate >= dollars * mult) }}
    action:
      - service: notify.email_alerts
        data:
          title: "Electric usage alert"
          message: |
            Your electric usage is trending over budget this billing cycle.

            Used so far: {{ used | round(0) }} kWh
            Utility forecast for the cycle: {{ proj | round(0) }} kWh
            Budget for {{ now().strftime('%B') }}: {{ budget | round(0) }} kWh
            Projected overage: {{ over | round(0) }} kWh (about ${{ (over * rate) | round(0) }} at ${{ rate }}/kWh)
            Estimated bill at the forecast: ${{ (states('input_number.electric_fixed_charge') | float(17.1) + proj * rate) | round(0) }}
          data:
            html: "{% from 'electric.jinja' import alert_html %}{{ alert_html(used, proj, budget, rate, states('input_number.electric_fixed_charge') | float(17.1), states('input_text.electric_history'), now().month, states('sensor.elec_account_07249118370720160943_current_bill_electric_cost_to_date') | float(0), states('sensor.elec_account_07249118370720160943_current_bill_electric_forecasted_cost') | float(0)) }}"
      - service: persistent_notification.create
        data:
          title: "Electric usage alert"
          notification_id: electric_alert
          message: "Forecast {{ proj | round(0) }} kWh vs budget {{ budget | round(0) }} kWh (about ${{ (over * rate) | round(0) }} over)."
      - service: input_text.set_value
        target:
          entity_id: input_text.electric_alert_month
        data:
          value: "{{ now().strftime('%Y-%m') }}"

  - id: electric_cycle_summary
    alias: Electric cycle bookkeeping
    mode: queued
    trigger:
      - platform: state
        entity_id: sensor.elec_account_07249118370720160943_current_bill_electric_usage_to_date
        id: usage
      - platform: state
        entity_id: sensor.elec_account_07249118370720160943_current_bill_electric_cost_to_date
        id: cost
    variables:
      new: "{{ trigger.to_state.state | float(0) }}"
      old: "{{ trigger.from_state.state | float(0) }}"
    action:
      - choose:
          - conditions:
              - condition: trigger
                id: usage
              - condition: template
                value_template: "{{ new < old - 5 }}"
            sequence:
              - variables:
                  total: "{{ states('input_number.electric_last_usage') | float(0) }}"
                  cost: "{{ states('input_number.electric_last_cost') | float(0) }}"
                  ended: "{{ now() - timedelta(days=3) }}"
                  label: "{{ ended.strftime('%b') }}"
                  budget: "{{ [750,650,600,450,400,400,400,450,450,320,520,700][ended.month - 1] }}"
                  hist: "{{ states('input_text.electric_history') }}"
                  start: "{{ states('input_datetime.electric_cycle_start') }}"
                  days: >
                    {% if start[:4] | int(0) > 2000 %}{{ (now().date() - strptime(start, '%Y-%m-%d').date()).days }}{% else %}0{% endif %}
                  tsum: "{{ states('input_number.electric_temp_sum_cycle') | float(0) }}"
                  tn: "{{ states('input_number.electric_temp_n_cycle') | float(0) }}"
                  tmean: "{{ (tsum / tn) | round(1) if tn >= 3 else -999 }}"
                  thist: "{{ states('input_text.electric_temp_history') }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.electric_closed_temp
                data:
                  value: "{{ tmean }}"
              - if:
                  - condition: template
                    value_template: "{{ tmean > -900 }}"
                then:
                  - service: input_text.set_value
                    target:
                      entity_id: input_text.electric_temp_history
                    data:
                      value: >
                        {{ ((thist.split(',') if thist else []) + [label ~ ':' ~ tmean])[-6:] | join(',') }}
              - service: input_number.set_value
                target:
                  entity_id: input_number.electric_temp_sum_cycle
                data:
                  value: 0
              - service: input_number.set_value
                target:
                  entity_id: input_number.electric_temp_n_cycle
                data:
                  value: 0
              - service: input_number.set_value
                target:
                  entity_id: input_number.electric_closed_total
                data:
                  value: "{{ total }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.electric_closed_cost
                data:
                  value: "{{ cost }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.electric_closed_budget
                data:
                  value: "{{ budget }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.electric_closed_days
                data:
                  value: "{{ [days, 70] | min }}"
              - service: input_text.set_value
                target:
                  entity_id: input_text.electric_closed_label
                data:
                  value: "{{ label }}"
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.electric_cycle_closed_pending
              - service: input_text.set_value
                target:
                  entity_id: input_text.electric_history
                data:
                  value: >
                    {{ ((hist.split(',') if hist else []) + [label ~ ':' ~ (total | round(0) | int)])[-6:] | join(',') }}
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.electric_cycle_start
                data:
                  date: "{{ now().strftime('%Y-%m-%d') }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.electric_last_usage
                data:
                  value: "{{ new }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.electric_last_cost
                data:
                  value: 0
          - conditions:
              - condition: trigger
                id: usage
              - condition: template
                value_template: "{{ new > old }}"
            sequence:
              - service: input_number.set_value
                target:
                  entity_id: input_number.electric_last_usage
                data:
                  value: "{{ new }}"
          - conditions:
              - condition: trigger
                id: cost
              - condition: template
                value_template: "{{ new > old }}"
            sequence:
              - service: input_number.set_value
                target:
                  entity_id: input_number.electric_last_cost
                data:
                  value: "{{ new }}"

  - id: electric_temp_sampler
    alias: Electric outdoor temperature sampler
    mode: queued
    trigger:
      - platform: time_pattern
        minutes: 0
    variables:
      t: "{{ state_attr(states('input_text.electric_weather_entity'), 'temperature') | float(-999) }}"
    condition:
      - condition: template
        value_template: "{{ t > -900 }}"
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.electric_temp_sum_cycle
        data:
          value: "{{ states('input_number.electric_temp_sum_cycle') | float(0) + t }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.electric_temp_n_cycle
        data:
          value: "{{ states('input_number.electric_temp_n_cycle') | float(0) + 1 }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.electric_temp_sum_week
        data:
          value: "{{ states('input_number.electric_temp_sum_week') | float(0) + t }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.electric_temp_n_week
        data:
          value: "{{ states('input_number.electric_temp_n_week') | float(0) + 1 }}"

  - id: electric_weekly_summary
    alias: Electric weekly summary (Friday 4 PM)
    mode: single
    trigger:
      - platform: time
        at: "16:00:00"
    condition:
      - condition: time
        weekday:
          - fri
    action:
      - variables:
          used: "{{ states('sensor.elec_account_07249118370720160943_current_bill_electric_usage_to_date') | float(0) }}"
          proj: "{{ [states('sensor.elec_account_07249118370720160943_current_bill_electric_forecasted_usage') | float(0), used] | max }}"
          budget: "{{ states('sensor.electric_monthly_budget') | float(0) }}"
          rate: "{{ states('sensor.electric_rate_per_kwh') | float(0.163) }}"
          fixed: "{{ states('input_number.electric_fixed_charge') | float(17.1) }}"
          hist: "{{ states('input_text.electric_history') }}"
          whist: "{{ states('input_text.electric_week_history') }}"
          ws: "{{ states('input_number.electric_week_start_usage') | float(0) }}"
          closed: "{{ is_state('input_boolean.electric_cycle_closed_pending', 'on') }}"
          closed_total: "{{ states('input_number.electric_closed_total') | float(0) }}"
          closed_cost: "{{ states('input_number.electric_closed_cost') | float(0) }}"
          closed_budget: "{{ states('input_number.electric_closed_budget') | float(0) }}"
          closed_days: "{{ states('input_number.electric_closed_days') | float(0) }}"
          closed_label: "{{ states('input_text.electric_closed_label') }}"
          final: "{{ 22 <= now().day <= 28 }}"
          wlabel: "{{ now().strftime('%-m/%-d') }}"
          cur_label: "{{ (now() if now().day < 29 else now() + timedelta(days=5)).strftime('%b') }}"
          temps: "{{ states('input_text.electric_temp_history') }}"
          wtemps: "{{ states('input_text.electric_week_temp_history') }}"
          cycle_temp: "{{ (states('input_number.electric_temp_sum_cycle') | float(0) / states('input_number.electric_temp_n_cycle') | float(1)) | round(1) if states('input_number.electric_temp_n_cycle') | float(0) >= 3 else -999 }}"
          week_temp: "{{ (states('input_number.electric_temp_sum_week') | float(0) / states('input_number.electric_temp_n_week') | float(1)) | round(1) if states('input_number.electric_temp_n_week') | float(0) >= 3 else -999 }}"
          prev_week_temp: "{{ (wtemps.split(',')[-1].split(':')[1] | float(-999)) if ':' in wtemps else -999 }}"
          closed_temp: "{{ states('input_number.electric_closed_temp') | float(-999) }}"
          comed_cost: "{{ states('sensor.elec_account_07249118370720160943_current_bill_electric_cost_to_date') | float(0) }}"
          comed_fc: "{{ states('sensor.elec_account_07249118370720160943_current_bill_electric_forecasted_cost') | float(0) }}"
          wk: >
            {% if ws <= 0 %}-1{% elif used >= ws %}{{ used - ws }}{% else %}{{ (closed_total - ws) + used }}{% endif %}
      - service: notify.email_alerts
        data:
          title: "{{ 'Electric month-end recap' if final else 'Electric weekly summary' }}"
          message: |
            {% if wk >= 0 %}This week: {{ wk | round(0) | int }} kWh (about ${{ (wk * rate) | round(0) | int }}){% else %}First weekly report: weekly figures start next Friday{% endif %}
            Cycle so far: {{ used | round(0) | int }} kWh (about ${{ (used * rate) | round(0) | int }})
            ComEd forecast: {{ proj | round(0) | int }} kWh vs budget {{ budget | round(0) | int }} kWh
            Estimated bill at the forecast: ${{ (fixed + proj * rate) | round(0) | int }}
            {% if week_temp > -900 %}Average outdoor temperature this week: {{ week_temp }}F{% if cycle_temp > -900 %}, this cycle: {{ cycle_temp }}F{% endif %}{% endif %}
            {% if closed %}Bill cycle complete ({{ closed_label }}): {{ closed_total | round(0) | int }} kWh, ${{ '%.2f' | format(closed_cost) }}{% endif %}
          data:
            html: >-
              {% from 'electric.jinja' import weekly_html %}{{ weekly_html(dict(used=used, proj=proj, budget=budget, rate=rate, fixed=fixed, hist=hist, whist=whist, wk=wk, wlabel=wlabel, cur_label=cur_label, temps=temps, wtemps=wtemps, cycle_temp=cycle_temp, week_temp=week_temp, prev_week_temp=prev_week_temp, closed_temp=closed_temp, closed=closed, closed_label=closed_label, closed_total=closed_total, closed_cost=closed_cost, closed_budget=closed_budget, closed_days=closed_days, final=final, comed_cost=comed_cost, comed_fc=comed_fc)) }}
      - if:
          - condition: template
            value_template: "{{ wk >= 0 }}"
        then:
          - service: input_text.set_value
            target:
              entity_id: input_text.electric_week_history
            data:
              value: >
                {% set ns = namespace(items=[]) %}{% for i in whist.split(',') if i and not i.startswith(wlabel ~ ':') %}{% set ns.items = ns.items + [i] %}{% endfor %}{{ (ns.items + [wlabel ~ ':' ~ (wk | round(0) | int)])[-8:] | join(',') }}
      - if:
          - condition: template
            value_template: "{{ week_temp > -900 }}"
        then:
          - service: input_text.set_value
            target:
              entity_id: input_text.electric_week_temp_history
            data:
              value: >
                {% set ns = namespace(items=[]) %}{% for i in wtemps.split(',') if i and not i.startswith(wlabel ~ ':') %}{% set ns.items = ns.items + [i] %}{% endfor %}{{ (ns.items + [wlabel ~ ':' ~ week_temp])[-8:] | join(',') }}
      - service: input_number.set_value
        target:
          entity_id: input_number.electric_temp_sum_week
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.electric_temp_n_week
        data:
          value: 0
      - service: input_number.set_value
        target:
          entity_id: input_number.electric_week_start_usage
        data:
          value: "{{ used }}"
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.electric_cycle_closed_pending
