# BookOrbit: browse/read 5_Books (EPUB Archive, Textbooks, Manga), Send-to-Kindle, metadata, OPDS.
# Based on upstream's docker-compose.yml (github.com/bookorbit/bookorbit).
# BookOrbit may edit, rename and move files in these folders. It has no access to the
# seedbox: only the three folders are mounted, and books-tools is the one-way path down.
# No Book Dock, download clients, indexers or TTS.
# A Tailscale sidecar gives it its own tailnet name with HTTPS
# (https://bookorbit.<tailnet>.ts.net) and forwards to the app over the compose network,
# so a Tailscale restart never takes the app down.
# Settings and secrets live in .env (made by setup.sh, never committed).
name: bookorbit

services:
  app:
    container_name: bookorbit-app
    image: ${APP_IMAGE:?required}
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      # LAN / NAS-IP fallback: http://<nas>:3080
      - "${APP_PORT:-3080}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      CLIENT_URL: ${APP_URL:?required}
      BOOK_DOCK_PATH: ""
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # One BookOrbit library per folder: EPUB Archive -> /books, Textbooks -> /textbooks,
      # Manga -> /manga. (books-tools files new books into the first two, `manga` the third.)
      - "${EPUB_DIR:-/volume1/NAS/Archive/5_Books/EPUB Archive}:/books"
      - "${TEXTBOOKS_DIR:-/volume1/NAS/Archive/5_Books/Textbooks}:/textbooks"
      - "${MANGA_DIR:-/volume1/NAS/Archive/5_Books/Manga}:/manga"
      - ./data/app:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  tailscale:
    container_name: bookorbit-ts
    image: tailscale/tailscale:v1.102.5
    hostname: ${TS_HOSTNAME:-bookorbit}
    restart: unless-stopped
    environment:
      TS_HOSTNAME: ${TS_HOSTNAME:-bookorbit}
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./data/tailscale:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro

  postgres:
    container_name: bookorbit-db
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
