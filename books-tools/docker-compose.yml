# Not a long-running service: books.sh runs one command at a time with
# "docker compose run --rm books ...". Settings live in .env.
services:
  books:
    build: .
    init: true
    image: books-tools:latest
    user: "${PUID}:${PGID}"
    env_file: .env
    environment:
      HOME: /data/home
      DATA_DIR: /data
      RCLONE_CONFIG: /data/rclone.conf
      SEEDBOX_MIRROR_DIR: ${SEEDBOX_MIRROR_DIR:-/volume1/NAS/Archive/_Seedbox_Mirror/Books}
    volumes:
      - ./data:/data
      - "${ARCHIVE_DIR}:${ARCHIVE_DIR}"
      # what comes down from the seedbox, outside 5_Books
      - "${SEEDBOX_MIRROR_DIR:-/volume1/NAS/Archive/_Seedbox_Mirror/Books}:${SEEDBOX_MIRROR_DIR:-/volume1/NAS/Archive/_Seedbox_Mirror/Books}"
      - "${LOGS_DIR}:${LOGS_DIR}"
